<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calibración Try-On</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        #canvas {
            display: block;
            margin-top: 20px;
            border: 1px solid #ccc;
            cursor: crosshair;
        }

        #result {
            margin-top: 20px;
            font-family: monospace;
        }
    </style>
</head>

<body>

    <h1>Calibración del anteojo</h1>

    <input type="file" id="imageInput" accept="image/png">

    <canvas id="canvas"></canvas>

    <div id="result">
        Seleccioná primero el ojo izquierdo y después el derecho.
    </div>

    <script>
        const input = document.getElementById("imageInput");
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        const result = document.getElementById("result");

        const image = new Image();

        let points = [];

        input.addEventListener("change", () => {
            const file = input.files[0];

            if (!file) {
                return;
            }

            const url = URL.createObjectURL(file);

            image.onload = () => {
                canvas.width = image.naturalWidth;
                canvas.height = image.naturalHeight;

                ctx.drawImage(image, 0, 0);

                points = [];

                result.textContent =
                    "Seleccioná primero el ojo izquierdo y después el derecho.";
            };

            image.src = url;
        });

        canvas.addEventListener("click", (event) => {
            if (!image.complete) {
                return;
            }

            if (points.length >= 2) {
                points = [];
                ctx.drawImage(image, 0, 0);
            }

            const rect = canvas.getBoundingClientRect();

            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            const x = (event.clientX - rect.left) * scaleX;
            const y = (event.clientY - rect.top) * scaleY;

            points.push({ x, y });

            ctx.drawImage(image, 0, 0);

            points.forEach((point, index) => {
                ctx.beginPath();
                ctx.arc(point.x, point.y, 8, 0, Math.PI * 2);
                ctx.fill();

                ctx.font = "24px Arial";
                ctx.fillText(
                    index === 0 ? "L" : "R",
                    point.x + 12,
                    point.y
                );
            });

            if (points.length === 1) {
                result.textContent =
                    `Ojo izquierdo: x=${x.toFixed(2)}, y=${y.toFixed(2)}`;
            }

            if (points.length === 2) {
                const left = points[0];
                const right = points[1];

                const dx = right.x - left.x;
                const dy = right.y - left.y;

                const distance = Math.sqrt(
                    dx * dx + dy * dy
                );

                const angle =
                    Math.atan2(dy, dx) * 180 / Math.PI;

                result.innerHTML = `
                    Ojo izquierdo: x=${left.x.toFixed(2)}, y=${left.y.toFixed(2)}<br>
                    Ojo derecho: x=${right.x.toFixed(2)}, y=${right.y.toFixed(2)}<br>
                    Distancia: ${distance.toFixed(2)} px<br>
                    Ángulo: ${angle.toFixed(2)}°
                `;
            }
        });
    </script>

</body>
</html>
